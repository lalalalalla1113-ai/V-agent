[project]
name = "vagent"
version = "1.0.0"
description = "V-AGENT"
requires-python = ">=3.10"
dependencies = [
    "flet==0.28.3",
    "requests>=2.31",
    "urllib3",
]

[tool.flet]
product = "V-AGENT"
org = "com.vagent"
company = "V-AGENT"
project = "vagent"
icon = "assets/icon.png"

[tool.flet.icons]
android = "assets/icon.png"
windows = "assets/icon.ico"

[tool.flet.splash]
color = "#151518"
dark_color = "#151518"
android_gravity = "fill"
hide_animation = true

[tool.flet.app]
path = "."
